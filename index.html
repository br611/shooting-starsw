<style>
  #game-wrapper {
    position: relative;
    width: 100%;
    max-width: 800px;
    aspect-ratio: 4 / 3;
    margin: 0 auto;
    border: 2px solid #00f3ff;
    box-shadow: 0 0 20px rgba(0, 243, 255, 0.3);
    font-family: 'Courier New', Courier, monospace;
    color: #00f3ff;
    background: #090d16;
    overflow: hidden;
    user-select: none;
  }
  #gameCanvas {
    display: block;
    width: 100%;
    height: 100%;
  }
  .screen-overlay {
    position: absolute;
    inset: 0;
    background: rgba(5, 8, 17, 0.88);
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    padding: 20px;
    z-index: 10;
  }
  .hidden {
    display: none !important;
  }
  #game-wrapper h1 {
    font-size: clamp(1.8rem, 5vw, 3rem);
    margin: 0 0 10px;
    text-shadow: 0 0 10px #00f3ff;
  }
  #gameover-screen h1 {
    color: #ff2a6d;
    text-shadow: 0 0 10px #ff2a6d;
  }
  .btn-launch {
    margin-top: 20px;
    padding: 12px 28px;
    font-size: 1.1rem;
    font-family: inherit;
    font-weight: bold;
    color: #050811;
    background: #00f3ff;
    border: none;
    cursor: pointer;
    box-shadow: 0 0 15px #00f3ff;
    transition: background 0.2s;
  }
  .btn-launch:hover {
    background: #ffffff;
  }
  .hud-display {
    position: absolute;
    top: 15px;
    left: 20px;
    right: 20px;
    display: flex;
    justify-content: space-between;
    font-size: 1.1rem;
    font-weight: bold;
    pointer-events: none;
    z-index: 5;
  }
</style>

<div id="game-wrapper">
  <!-- Main Rendering Layer -->
  <canvas id="gameCanvas" width="800" height="600"></canvas>

  <!-- Menu Interfaces -->
  <div id="start-screen" class="screen-overlay">
    <h1 id="theme-title">CYBER BLASTAR</h1>
    <p id="theme-tagline">Neutralize system errors before they breach the firewall.</p>
    <p style="font-size: 0.9rem; color: #8892b0;">[ARROWS / A-D] Move &nbsp;|&nbsp; [SPACE] Fire</p>
    <button class="btn-launch" onclick="beginSimulation()">BOOT SYSTEMS</button>
  </div>

  <div id="gameover-screen" class="screen-overlay hidden">
    <h1>CRITICAL BREACH</h1>
    <p>The core firewall infrastructure was compromised.</p>
    <p>FINAL SCORE: <span id="final-score">0</span></p>
    <button class="btn-launch" onclick="restartSimulation()">REBOOT FIRMWARE</button>
  </div>

  <!-- Real-Time Metrics Overlay -->
  <div class="hud-display">
    <div class="hud-label score">SCORE: <span id="ui-score">0</span></div>
    <div class="hud-label">SHIELD: <span id="ui-shield">100%</span></div>
  </div>
</div>

<script>
  (function() {
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const startScreen = document.getElementById('start-screen');
    const gameoverScreen = document.getElementById('gameover-screen');
    const uiScore = document.getElementById('ui-score');
    const uiShield = document.getElementById('ui-shield');
    const finalScore = document.getElementById('final-score');

    let gameActive = false;
    let score = 0;
    let shield = 100;
    let keys = {};
    let bullets = [];
    let enemies = [];
    let spawnTimer = 0;

    const player = { x: 380, y: 540, width: 40, height: 20, speed: 6 };

    window.addEventListener('keydown', function(e) {
      keys[e.code] = true;
      if (e.code === 'Space' && gameActive) {
        e.preventDefault();
        bullets.push({
          x: player.x + player.width / 2 - 2,
          y: player.y,
          width: 4,
          height: 12,
          speed: 9
        });
      }
    });

    window.addEventListener('keyup', function(e) {
      keys[e.code] = false;
    });

    function updateHUD() {
      uiScore.textContent = score;
      uiShield.textContent = shield + '%';
    }

    function resetState() {
      score = 0;
      shield = 100;
      bullets = [];
      enemies = [];
      spawnTimer = 0;
      player.x = 380;
      updateHUD();
    }

    window.beginSimulation = function() {
      startScreen.classList.add('hidden');
      gameoverScreen.classList.add('hidden');
      resetState();
      gameActive = true;
      requestAnimationFrame(gameLoop);
    };

    window.restartSimulation = function() {
      window.beginSimulation();
    };

    function gameLoop() {
      if (!gameActive) return;
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Player movement
      if ((keys['ArrowLeft'] || keys['KeyA']) && player.x > 0) {
        player.x -= player.speed;
      }
      if ((keys['ArrowRight'] || keys['KeyD']) && player.x < canvas.width - player.width) {
        player.x += player.speed;
      }

      // Draw player ship
      ctx.fillStyle = '#00f3ff';
      ctx.fillRect(player.x, player.y, player.width, player.height);
      ctx.fillRect(player.x + 15, player.y - 8, 10, 8);

      // Update & draw bullets
      ctx.fillStyle = '#ffffff';
      for (let i = bullets.length - 1; i >= 0; i--) {
        bullets[i].y -= bullets[i].speed;
        ctx.fillRect(bullets[i].x, bullets[i].y, bullets[i].width, bullets[i].height);
        if (bullets[i].y < 0) bullets.splice(i, 1);
      }

      // Spawn system errors (enemies)
      spawnTimer++;
      if (spawnTimer > 45) {
        enemies.push({
          x: Math.random() * (canvas.width - 30),
          y: -30,
          width: 30,
          height: 30,
          speed: 2 + Math.random() * 2 + (score / 2000)
        });
        spawnTimer = 0;
      }

      // Update & draw enemies
      ctx.fillStyle = '#ff2a6d';
      for (let i = enemies.length - 1; i >= 0; i--) {
        let e = enemies[i];
        e.y += e.speed;
        ctx.fillRect(e.x, e.y, e.width, e.height);

        // Bullet hit detection
        let hit = false;
        for (let j = bullets.length - 1; j >= 0; j--) {
          let b = bullets[j];
          if (
            b.x < e.x + e.width &&
            b.x + b.width > e.x &&
            b.y < e.y + e.height &&
            b.y + b.height > e.y
          ) {
            enemies.splice(i, 1);
            bullets.splice(j, 1);
            score += 100;
            updateHUD();
            hit = true;
            break;
          }
        }
        if (hit) continue;

        // Firewall breach check
        if (e.y > canvas.height) {
          enemies.splice(i, 1);
          shield -= 20;
          updateHUD();
          if (shield <= 0) {
            gameActive = false;
            finalScore.textContent = score;
            gameoverScreen.classList.remove('hidden');
          }
        }
      }

      requestAnimationFrame(gameLoop);
    }
  })();
</script>
